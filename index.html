<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student REGISTRATION</title>
<style>
   
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url('background.jpeg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
   
.container{max-width:650px;margin:30px auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
h2{text-align:center;color:#0b63ce}
label{display:block;margin-top:12px;font-weight:bold}
input,select,textarea{width:100%;padding:10px;margin-top:5px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:20px;background:#0b63ce;color:#fff;border:none;border-radius:5px;font-size:16px;cursor:pointer}
#msg{margin-top:15px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div style="background:white;
            padding:15px;
            text-align:center;
            box-shadow:0 3px 10px rgba(0,0,0,.3);">

    <img src="trt.png"
         style="max-width:700px;width:95%;height:auto;">

</div>
</div>
<div class="container">
<h2>STUDENT REGISTRATION</h2>
<form id="studentForm">
<label>Student Name</label><input name="name" required>
<label>Department</label>
<select name="department" required>
<option value="">Select</option>
<option>BTech Computer Science engineering </option>
   <option>BTech Computer Science And Business systems</option>
<option> BTech Electronics & Communication</option>
<option>BTech Artificial intelligence and Data science</option>
<option>BCA</option>
<option>BBA</option>
   <option>MBA</option>
</select>
<label>Semester</label>
<select name="semester" required>
<option value="">Select</option>
<option>S1</option>
<option>S2</option>
<option>S3</option>

</select>
<label>Mobile</label><input name="mobile"required>
<label>Email</label><input type="email" name="email"required>
<label>Parent Name</label><input name="parentname"required>
<label>Parent Mobile</label><input name="parentmobile"required>

<label>Bus Facility Needed</label>
<select id="busfacility" name="busfacility" onchange="toggleBoarding()" required>
    <option value="">Select</option>
    <option value="Yes">Yes</option>
    <option value="No">No</option>
</select>

<div id="boardingDiv" style="display:none; margin-top:15px;">
    <label>Boarding Point</label>
    <input type="text" id="boardingpoint" name="boardingpoint">
</div>
   
   <label>HOSTEL facility needed</label>
<select name="hostelfacility" required>
<option value="">Select</option>
<option>Yes</option><option>No</option><option>
   </select>
<button type="submit">Submit</button>
<div id="msg"></div>
</form>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwslqS7-7EGCnOunTGLtC9_hMXoaubhG0bo4s0KiiLPtk4ViYLl9Gj_ThUIfyEtqkdM/exec";
function toggleBoarding() {
const bus=document.getElementById("busfacility").value;
const div=document.getElementById("boardingDiv");
const input=document.getElementById("boardingpoint");
if(bus==="Yes"){div.style.display="block";input.required=true;}
else{div.style.display="none";input.required=false;input.value="";}
}

document.getElementById("studentForm").addEventListener("submit",async(e)=>{
e.preventDefault();
msg.textContent="Submitting...";
try{
 let r=await fetch(SCRIPT_URL,{method:"POST",body:new FormData(e.target)});
 let t=await r.text();
 msg.textContent="Registration Successful";
 e.target.reset();
}catch(err){msg.textContent="Submission Failed";}
});
</script>

<footer class="footer">
    <h3>KMCT College of Engineering for Emerging Technology and Management</h3>
    <p>Vadakara, Kerala</p>

    <hr>

    <p class="copyright">
        © 2026 KMCT College of Engineering for Emerging Technology and Management.
        All Rights Reserved.
    </p>
</footer>








   


   
</body></html>
